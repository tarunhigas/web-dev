<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ScientificCalc</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface2: #263548;
      --border: #334155;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #6366f1;
      --accent2: #818cf8;
      --operator: #f59e0b;
      --special: #10b981;
      --danger: #ef4444;
      --equals: #6366f1;
      --radius: 10px;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family:'Inter',sans-serif;
      background:var(--bg); color:var(--text);
      min-height:100vh; display:flex; flex-direction:column; align-items:center;
    }

    /* TOP BAR */
    .topbar {
      width:100%; display:flex; justify-content:space-between; align-items:center;
      padding:1rem 1.5rem;
    }
    .topbar-logo { font-size:0.95rem; font-weight:700; color:var(--accent2); }
    .back-link { font-size:0.82rem; color:var(--text-muted); text-decoration:none; }
    .back-link:hover { color:var(--accent2); }

    /* OUTER WRAP */
    .calc-wrap {
      display:grid; grid-template-columns:320px 260px;
      gap:1.5rem; padding:1rem 1.5rem 2rem;
      align-items:start;
    }

    /* CALCULATOR */
    .calculator {
      background:var(--surface); border-radius:20px;
      padding:1.25rem; box-shadow:0 20px 60px rgba(0,0,0,0.5);
      border:1px solid var(--border);
    }

    /* DISPLAY */
    .display {
      background:var(--bg); border-radius:12px;
      padding:1rem 1.25rem; margin-bottom:1rem;
      min-height:100px; display:flex; flex-direction:column;
      justify-content:flex-end; align-items:flex-end;
      border:1px solid var(--border);
    }
    .display-expr {
      font-family:'JetBrains Mono',monospace;
      font-size:0.8rem; color:var(--text-muted);
      min-height:1.2rem; word-break:break-all; text-align:right;
    }
    .display-main {
      font-family:'JetBrains Mono',monospace;
      font-size:2rem; font-weight:600; color:var(--text);
      word-break:break-all; text-align:right; line-height:1.2;
    }
    .display-main.error { color:var(--danger); font-size:1.2rem; }

    /* MODE TOGGLE */
    .mode-row {
      display:flex; gap:0.4rem; margin-bottom:0.85rem;
    }
    .mode-btn {
      flex:1; padding:0.4rem; border-radius:6px;
      font-size:0.75rem; font-weight:600;
      background:var(--bg); border:1px solid var(--border);
      color:var(--text-muted);
    }
    .mode-btn.active { background:var(--accent); color:#fff; border-color:var(--accent); }

    /* BUTTONS */
    .btn-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:0.5rem; }
    .calc-btn {
      padding:0.75rem 0.5rem; border-radius:var(--radius);
      font-size:0.9rem; font-weight:600;
      background:var(--surface2); color:var(--text);
      border:1px solid var(--border);
      display:grid; place-items:center;
      user-select:none;
    }
    .calc-btn:hover { background:#2d3f56; }
    .calc-btn:active { transform:scale(0.95); }
    .calc-btn.op     { background:#2d2508; color:var(--operator); border-color:#4a3a0a; }
    .calc-btn.op:hover { background:#3d320a; }
    .calc-btn.fn     { background:#0d2318; color:var(--special);  border-color:#0f3520; font-size:0.78rem; }
    .calc-btn.fn:hover { background:#122d20; }
    .calc-btn.clear  { background:#2d1010; color:var(--danger);   border-color:#4a1a1a; }
    .calc-btn.clear:hover { background:#3d1515; }
    .calc-btn.equals { background:var(--equals); color:#fff; border-color:var(--equals); grid-column:span 1; }
    .calc-btn.equals:hover { background:#4f46e5; }
    .calc-btn.zero   { grid-column:span 2; }
    .calc-btn.small  { font-size:0.72rem; }

    /* HISTORY PANEL */
    .history-panel {
      background:var(--surface); border-radius:20px;
      padding:1.25rem; border:1px solid var(--border);
      box-shadow:0 20px 60px rgba(0,0,0,0.5);
    }
    .history-header {
      display:flex; justify-content:space-between; align-items:center;
      margin-bottom:1rem;
    }
    .history-header h3 { font-size:0.9rem; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.05em; }
    .clear-history {
      font-size:0.75rem; color:var(--danger);
      background:none; border:none; cursor:pointer;
    }
    .history-list { display:flex; flex-direction:column; gap:0.5rem; max-height:380px; overflow-y:auto; }
    .history-empty { text-align:center; color:var(--text-muted); font-size:0.85rem; padding:2rem 0; }
    .history-item {
      background:var(--bg); border-radius:8px; padding:0.6rem 0.85rem;
      border:1px solid var(--border); cursor:pointer;
    }
    .history-item:hover { border-color:var(--accent); }
    .history-expr { font-size:0.75rem; color:var(--text-muted); font-family:'JetBrains Mono',monospace; }
    .history-result { font-size:0.95rem; font-weight:600; color:var(--accent2); font-family:'JetBrains Mono',monospace; }

    /* KEYBOARD HINT */
    .kb-hint { font-size:0.72rem; color:var(--text-muted); text-align:center; margin-top:0.75rem; }

    footer { padding:1.5rem; font-size:0.78rem; color:var(--text-muted); }

    @media(max-width:640px){
      .calc-wrap { grid-template-columns:1fr; }
      .history-panel { display:none; }
    }
  </style>
</head>
<body>

<div class="topbar">
  <div class="topbar-logo">🧮 ScientificCalc</div>
  <a href="../index.html" class="back-link">← Portfolio</a>
</div>

<div class="calc-wrap">
  <div class="calculator">
    <div class="display">
      <div class="display-expr" id="display-expr"></div>
      <div class="display-main" id="display-main">0</div>
    </div>

    <div class="mode-row">
      <button class="mode-btn active" id="mode-deg" onclick="setMode('deg')">DEG</button>
      <button class="mode-btn" id="mode-rad" onclick="setMode('rad')">RAD</button>
    </div>

    <div class="btn-grid" id="btn-grid">
      <!-- Row 1: scientific -->
      <button class="calc-btn fn small" onclick="inputFn('sin(')">sin</button>
      <button class="calc-btn fn small" onclick="inputFn('cos(')">cos</button>
      <button class="calc-btn fn small" onclick="inputFn('tan(')">tan</button>
      <button class="calc-btn fn small" onclick="inputFn('log(')">log</button>

      <!-- Row 2: more scientific -->
      <button class="calc-btn fn small" onclick="inputFn('sqrt(')">√</button>
      <button class="calc-btn fn small" onclick="inputFn('ln(')">ln</button>
      <button class="calc-btn fn small" onclick="inputFn('abs(')">|x|</button>
      <button class="calc-btn fn small" onclick="inputOp('^')">xʸ</button>

      <!-- Row 3: clear + bracket -->
      <button class="calc-btn clear" onclick="clearAll()">AC</button>
      <button class="calc-btn clear" onclick="backspace()">⌫</button>
      <button class="calc-btn op" onclick="inputOp('(')">(</button>
      <button class="calc-btn op" onclick="inputOp(')')">)</button>

      <!-- Row 4 -->
      <button class="calc-btn fn small" onclick="inputConst('π')">π</button>
      <button class="calc-btn fn small" onclick="inputConst('e')">e</button>
      <button class="calc-btn op" onclick="inputOp('%')">%</button>
      <button class="calc-btn op" onclick="inputOp('÷')">÷</button>

      <!-- Row 5 -->
      <button class="calc-btn" onclick="inputNum('7')">7</button>
      <button class="calc-btn" onclick="inputNum('8')">8</button>
      <button class="calc-btn" onclick="inputNum('9')">9</button>
      <button class="calc-btn op" onclick="inputOp('×')">×</button>

      <!-- Row 6 -->
      <button class="calc-btn" onclick="inputNum('4')">4</button>
      <button class="calc-btn" onclick="inputNum('5')">5</button>
      <button class="calc-btn" onclick="inputNum('6')">6</button>
      <button class="calc-btn op" onclick="inputOp('−')">−</button>

      <!-- Row 7 -->
      <button class="calc-btn" onclick="inputNum('1')">1</button>
      <button class="calc-btn" onclick="inputNum('2')">2</button>
      <button class="calc-btn" onclick="inputNum('3')">3</button>
      <button class="calc-btn op" onclick="inputOp('+')">+</button>

      <!-- Row 8 -->
      <button class="calc-btn fn small" onclick="toggleSign()">+/−</button>
      <button class="calc-btn" onclick="inputNum('0')">0</button>
      <button class="calc-btn" onclick="inputDot()">.</button>
      <button class="calc-btn equals" onclick="calculate()">=</button>
    </div>
    <div class="kb-hint">Keyboard supported: 0-9, + - * / . Enter Backspace Escape</div>
  </div>

  <div class="history-panel">
    <div class="history-header">
      <h3>History</h3>
      <button class="clear-history" onclick="clearHistory()">Clear all</button>
    </div>
    <div class="history-list" id="history-list">
      <div class="history-empty">No calculations yet.</div>
    </div>
  </div>
</div>

<footer>ScientificCalc — A demo project by S Tarunhiga</footer>

<script>
  let expression = '';
  let mode = 'deg'; // deg | rad
  let history = [];

  function setMode(m) {
    mode = m;
    document.getElementById('mode-deg').classList.toggle('active', m === 'deg');
    document.getElementById('mode-rad').classList.toggle('active', m === 'rad');
  }

  function updateDisplay() {
    document.getElementById('display-expr').textContent = expression;
    const main = document.getElementById('display-main');
    main.classList.remove('error');
    if (!expression) { main.textContent = '0'; return; }
    // Live eval preview
    try {
      const r = evalExpr(expression);
      if (!isNaN(r) && isFinite(r)) {
        main.textContent = formatNum(r);
      } else {
        main.textContent = expression.slice(-12) || '0';
      }
    } catch {
      main.textContent = expression.slice(-12) || '0';
    }
  }

  function formatNum(n) {
    if (Math.abs(n) >= 1e12 || (Math.abs(n) < 1e-7 && n !== 0)) return n.toExponential(6);
    const s = parseFloat(n.toFixed(10)).toString();
    return s;
  }

  function inputNum(n)  { expression += n; updateDisplay(); }
  function inputDot()   { const parts = expression.split(/[\+\-\×\÷\^\(\)]/); const last = parts[parts.length-1]; if (!last.includes('.')) { expression += '.'; updateDisplay(); } }
  function inputOp(op)  { expression += op; updateDisplay(); }
  function inputFn(fn)  { expression += fn; updateDisplay(); }
  function inputConst(c){ expression += (c === 'π' ? 'π' : 'e'); updateDisplay(); }
  function clearAll()   { expression = ''; updateDisplay(); }
  function backspace()  { expression = expression.slice(0,-1); updateDisplay(); }
  function toggleSign() {
    if (!expression) return;
    if (expression.startsWith('-(')) { expression = expression.slice(2,-1); }
    else { expression = '-(' + expression + ')'; }
    updateDisplay();
  }

  function calculate() {
    if (!expression) return;
    const expr = expression;
    try {
      const result = evalExpr(expr);
      if (isNaN(result) || !isFinite(result)) throw new Error('Math Error');
      const formatted = formatNum(result);
      addHistory(expr, formatted);
      expression = formatted;
      document.getElementById('display-expr').textContent = expr + ' =';
      const main = document.getElementById('display-main');
      main.classList.remove('error');
      main.textContent = formatted;
    } catch(e) {
      document.getElementById('display-main').textContent = 'Error';
      document.getElementById('display-main').classList.add('error');
      expression = '';
    }
  }

  function evalExpr(expr) {
    // Replace display symbols with JS operators
    let s = expr
      .replace(/×/g, '*')
      .replace(/÷/g, '/')
      .replace(/−/g, '-')
      .replace(/\^/g, '**')
      .replace(/π/g, Math.PI)
      .replace(/\be\b/g, Math.E)
      .replace(/sqrt\(/g, 'Math.sqrt(')
      .replace(/abs\(/g, 'Math.abs(')
      .replace(/log\(/g, 'Math.log10(')
      .replace(/ln\(/g, 'Math.log(')
      .replace(/sin\(/g,  mode === 'deg' ? '(x=>Math.sin(x*Math.PI/180))(' : 'Math.sin(')
      .replace(/cos\(/g,  mode === 'deg' ? '(x=>Math.cos(x*Math.PI/180))(' : 'Math.cos(')
      .replace(/tan\(/g,  mode === 'deg' ? '(x=>Math.tan(x*Math.PI/180))(' : 'Math.tan(')
      .replace(/%/g, '/100');
    return Function('"use strict"; return (' + s + ')')();
  }

  function addHistory(expr, result) {
    history.unshift({ expr, result });
    if (history.length > 20) history.pop();
    renderHistory();
  }

  function renderHistory() {
    const list = document.getElementById('history-list');
    if (history.length === 0) { list.innerHTML = '<div class="history-empty">No calculations yet.</div>'; return; }
    list.innerHTML = history.map((h,i) => `
      <div class="history-item" onclick="useHistory(${i})">
        <div class="history-expr">${h.expr}</div>
        <div class="history-result">= ${h.result}</div>
      </div>
    `).join('');
  }

  function useHistory(i) {
    expression = history[i].result;
    updateDisplay();
  }

  function clearHistory() { history = []; renderHistory(); }

  // Keyboard support
  document.addEventListener('keydown', e => {
    if (e.key >= '0' && e.key <= '9') inputNum(e.key);
    else if (e.key === '+') inputOp('+');
    else if (e.key === '-') inputOp('−');
    else if (e.key === '*') inputOp('×');
    else if (e.key === '/') { e.preventDefault(); inputOp('÷'); }
    else if (e.key === '.') inputDot();
    else if (e.key === 'Enter' || e.key === '=') calculate();
    else if (e.key === 'Backspace') backspace();
    else if (e.key === 'Escape') clearAll();
    else if (e.key === '(') inputOp('(');
    else if (e.key === ')') inputOp(')');
    else if (e.key === '%') inputOp('%');
    else if (e.key === '^') inputOp('^');
  });
</script>
</body>
</html>
