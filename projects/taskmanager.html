<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow — Task Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f1f5f9;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #1e293b;
      --text-muted: #64748b;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --danger: #ef4444;
      --success: #10b981;
      --warning: #f59e0b;
      --radius: 10px;
      --shadow: 0 2px 8px rgba(0,0,0,0.07);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
    button { cursor:pointer; border:none; font-family:inherit; }
    input, textarea, select { font-family:inherit; }

    /* TOP BAR */
    .topbar {
      background:var(--surface); border-bottom:1px solid var(--border);
      padding:0 1.5rem; height:60px;
      display:flex; align-items:center; justify-content:space-between;
      box-shadow:var(--shadow);
    }
    .topbar-logo { font-size:1.2rem; font-weight:700; color:var(--accent); }
    .topbar-right { display:flex; align-items:center; gap:1rem; }
    .back-link { font-size:0.82rem; color:var(--text-muted); text-decoration:none; }
    .back-link:hover { color:var(--accent); }
    .stats { display:flex; gap:1rem; font-size:0.82rem; color:var(--text-muted); }
    .stat strong { color:var(--text); }

    /* LAYOUT */
    .layout { max-width:760px; margin:0 auto; padding:2rem 1.5rem; }

    /* ADD TASK FORM */
    .add-form {
      background:var(--surface); border:1px solid var(--border);
      border-radius:var(--radius); padding:1.25rem;
      box-shadow:var(--shadow); margin-bottom:1.5rem;
    }
    .add-form h2 { font-size:1rem; font-weight:600; margin-bottom:1rem; }
    .form-row { display:flex; gap:0.75rem; flex-wrap:wrap; }
    .form-row input[type="text"] {
      flex:1; min-width:180px;
      padding:0.6rem 0.9rem; border:2px solid var(--border);
      border-radius:8px; font-size:0.9rem; outline:none;
    }
    .form-row input[type="text"]:focus { border-color:var(--accent); }
    .form-row input[type="date"] {
      padding:0.6rem 0.9rem; border:2px solid var(--border);
      border-radius:8px; font-size:0.9rem; outline:none;
    }
    .form-row input[type="date"]:focus { border-color:var(--accent); }
    .priority-select {
      padding:0.6rem 0.9rem; border:2px solid var(--border);
      border-radius:8px; font-size:0.9rem; outline:none; background:var(--surface);
    }
    .priority-select:focus { border-color:var(--accent); }
    .add-btn {
      padding:0.6rem 1.25rem; background:var(--accent); color:#fff;
      border-radius:8px; font-weight:600; font-size:0.9rem;
      white-space:nowrap;
    }
    .add-btn:hover { background:var(--accent-hover); }

    /* FILTERS */
    .filters {
      display:flex; gap:0.5rem; margin-bottom:1rem; flex-wrap:wrap;
      align-items:center; justify-content:space-between;
    }
    .filter-group { display:flex; gap:0.4rem; }
    .filter-btn {
      padding:0.35rem 0.85rem; border-radius:50px;
      font-size:0.8rem; font-weight:500;
      border:2px solid var(--border); background:var(--surface);
      color:var(--text-muted);
    }
    .filter-btn.active, .filter-btn:hover {
      background:var(--accent); color:#fff; border-color:var(--accent);
    }
    .search-input {
      padding:0.35rem 0.85rem; border:2px solid var(--border);
      border-radius:50px; font-size:0.82rem; outline:none; width:180px;
    }
    .search-input:focus { border-color:var(--accent); }

    /* TASK LIST */
    .task-list { display:flex; flex-direction:column; gap:0.6rem; }
    .empty-state {
      text-align:center; padding:3rem; color:var(--text-muted);
      background:var(--surface); border-radius:var(--radius);
      border:1px dashed var(--border);
    }
    .empty-state .emoji { font-size:2.5rem; margin-bottom:0.5rem; }

    .task-item {
      background:var(--surface); border:1px solid var(--border);
      border-radius:var(--radius); padding:1rem 1.25rem;
      display:flex; align-items:center; gap:1rem;
      box-shadow:var(--shadow);
    }
    .task-item.done { opacity:0.55; }
    .task-item.done .task-text { text-decoration:line-through; color:var(--text-muted); }

    .task-check {
      width:22px; height:22px; border-radius:50%;
      border:2px solid var(--border); background:none;
      display:grid; place-items:center; flex-shrink:0;
      font-size:0.8rem;
    }
    .task-check.checked { background:var(--success); border-color:var(--success); color:#fff; }

    .task-body { flex:1; min-width:0; }
    .task-text { font-size:0.92rem; font-weight:500; margin-bottom:0.2rem; }
    .task-meta { display:flex; gap:0.6rem; align-items:center; flex-wrap:wrap; }
    .priority-badge {
      padding:0.15rem 0.55rem; border-radius:50px; font-size:0.72rem; font-weight:600;
    }
    .priority-badge.high   { background:#fee2e2; color:#dc2626; }
    .priority-badge.medium { background:#fef3c7; color:#d97706; }
    .priority-badge.low    { background:#d1fae5; color:#059669; }
    .task-due { font-size:0.75rem; color:var(--text-muted); }
    .task-due.overdue { color:var(--danger); font-weight:600; }

    .task-actions { display:flex; gap:0.4rem; }
    .task-action-btn {
      width:30px; height:30px; border-radius:6px;
      background:var(--bg); border:1px solid var(--border);
      font-size:0.8rem; display:grid; place-items:center;
    }
    .task-action-btn:hover { background:var(--danger); color:#fff; border-color:var(--danger); }
    .task-action-btn.edit-btn:hover { background:var(--accent); color:#fff; border-color:var(--accent); }

    /* PROGRESS BAR */
    .progress-bar-wrap { margin-bottom:1.5rem; }
    .progress-label { font-size:0.82rem; color:var(--text-muted); margin-bottom:0.4rem; display:flex; justify-content:space-between; }
    .progress-track { height:8px; background:var(--border); border-radius:50px; overflow:hidden; }
    .progress-fill { height:100%; background:linear-gradient(90deg,var(--accent),var(--success)); border-radius:50px; transition:width 0.4s ease; }

    footer { text-align:center; padding:2rem; font-size:0.8rem; color:var(--text-muted); }
  </style>
</head>
<body>

<div class="topbar">
  <div class="topbar-logo">✅ TaskFlow</div>
  <div class="topbar-right">
    <div class="stats">
      <span><strong id="stat-total">0</strong> total</span>
      <span><strong id="stat-done">0</strong> done</span>
      <span><strong id="stat-pending">0</strong> pending</span>
    </div>
    <a href="../index.html" class="back-link">← Portfolio</a>
  </div>
</div>

<div class="layout">

  <div class="add-form">
    <h2>Add a New Task</h2>
    <div class="form-row">
      <input type="text" id="task-input" placeholder="What needs to be done?" />
      <select class="priority-select" id="priority-select">
        <option value="medium">Medium Priority</option>
        <option value="high">High Priority</option>
        <option value="low">Low Priority</option>
      </select>
      <input type="date" id="due-date" />
      <button class="add-btn" id="add-btn">+ Add Task</button>
    </div>
  </div>

  <div class="progress-bar-wrap">
    <div class="progress-label">
      <span>Progress</span>
      <span id="progress-pct">0%</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progress-fill" style="width:0%"></div>
    </div>
  </div>

  <div class="filters">
    <div class="filter-group">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="active">Active</button>
      <button class="filter-btn" data-filter="done">Done</button>
      <button class="filter-btn" data-filter="high">High</button>
    </div>
    <input type="text" class="search-input" id="search-input" placeholder="🔍 Search..." />
  </div>

  <div class="task-list" id="task-list"></div>

</div>

<footer>TaskFlow — A demo project by S Tarunhiga</footer>

<script>
  let tasks = JSON.parse(localStorage.getItem('taskflow_tasks') || '[]');
  let filter = 'all';
  let search = '';
  let editId = null;

  // Seed with some sample tasks if empty
  if (tasks.length === 0) {
    tasks = [
      { id: 1, text: 'Complete web dev assignment', priority: 'high', due: '', done: false },
      { id: 2, text: 'Read DSA chapter 3', priority: 'medium', due: '', done: false },
      { id: 3, text: 'Push code to GitHub', priority: 'low', due: '', done: true },
    ];
    save();
  }

  function save() { localStorage.setItem('taskflow_tasks', JSON.stringify(tasks)); }

  function getFiltered() {
    return tasks.filter(t => {
      if (filter === 'active' && t.done) return false;
      if (filter === 'done'   && !t.done) return false;
      if (filter === 'high'   && t.priority !== 'high') return false;
      if (search && !t.text.toLowerCase().includes(search.toLowerCase())) return false;
      return true;
    });
  }

  function isOverdue(due) {
    if (!due) return false;
    return new Date(due) < new Date(new Date().toDateString());
  }

  function render() {
    const list = getFiltered();
    const container = document.getElementById('task-list');

    if (list.length === 0) {
      container.innerHTML = `<div class="empty-state"><div class="emoji">📋</div><p>No tasks here. Add one above!</p></div>`;
    } else {
      container.innerHTML = list.map(t => `
        <div class="task-item ${t.done ? 'done' : ''}" id="task-${t.id}">
          <button class="task-check ${t.done ? 'checked' : ''}" onclick="toggleDone(${t.id})">
            ${t.done ? '✓' : ''}
          </button>
          <div class="task-body">
            <div class="task-text">${t.text}</div>
            <div class="task-meta">
              <span class="priority-badge ${t.priority}">${t.priority}</span>
              ${t.due ? `<span class="task-due ${isOverdue(t.due) && !t.done ? 'overdue' : ''}">📅 ${t.due}${isOverdue(t.due) && !t.done ? ' · overdue' : ''}</span>` : ''}
            </div>
          </div>
          <div class="task-actions">
            <button class="task-action-btn edit-btn" onclick="startEdit(${t.id})" title="Edit">✏️</button>
            <button class="task-action-btn" onclick="deleteTask(${t.id})" title="Delete">🗑️</button>
          </div>
        </div>
      `).join('');
    }

    // Stats
    const total   = tasks.length;
    const done    = tasks.filter(t => t.done).length;
    const pending = total - done;
    document.getElementById('stat-total').textContent   = total;
    document.getElementById('stat-done').textContent    = done;
    document.getElementById('stat-pending').textContent = pending;

    const pct = total === 0 ? 0 : Math.round((done / total) * 100);
    document.getElementById('progress-pct').textContent  = pct + '%';
    document.getElementById('progress-fill').style.width = pct + '%';
  }

  function addTask() {
    const input = document.getElementById('task-input');
    const text  = input.value.trim();
    if (!text) { input.focus(); return; }
    const priority = document.getElementById('priority-select').value;
    const due      = document.getElementById('due-date').value;

    if (editId !== null) {
      const t = tasks.find(x => x.id === editId);
      if (t) { t.text = text; t.priority = priority; t.due = due; }
      editId = null;
      document.getElementById('add-btn').textContent = '+ Add Task';
    } else {
      tasks.unshift({ id: Date.now(), text, priority, due, done: false });
    }
    input.value = '';
    document.getElementById('due-date').value = '';
    save(); render();
  }

  function toggleDone(id) {
    const t = tasks.find(x => x.id === id);
    if (t) { t.done = !t.done; save(); render(); }
  }

  function deleteTask(id) {
    tasks = tasks.filter(x => x.id !== id);
    save(); render();
  }

  function startEdit(id) {
    const t = tasks.find(x => x.id === id);
    if (!t) return;
    document.getElementById('task-input').value           = t.text;
    document.getElementById('priority-select').value      = t.priority;
    document.getElementById('due-date').value             = t.due || '';
    document.getElementById('add-btn').textContent        = 'Update Task';
    editId = id;
    document.getElementById('task-input').focus();
  }

  document.getElementById('add-btn').addEventListener('click', addTask);
  document.getElementById('task-input').addEventListener('keydown', e => { if (e.key === 'Enter') addTask(); });

  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filter = btn.dataset.filter;
      render();
    });
  });

  document.getElementById('search-input').addEventListener('input', e => {
    search = e.target.value;
    render();
  });

  render();
</script>
</body>
</html>
